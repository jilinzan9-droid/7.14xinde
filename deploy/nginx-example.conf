# Administrative reference for the existing production server, 2026-11-10.
# Normal website deployments do not install this file.
# Requires the existing legacy/cache HTTP maps and server snippets, plus
# certificates covering both hostnames. Verify these before adapting this file.
# Preserve Certbot renewal settings and test ACME paths after routing changes.
server {
    server_name www.pratt-oil.com pratt-oil.com;
    root /var/www/html/demo/pratt-oil-oilfield;

    # Static delivery settings maintained in the website repository.
    include /etc/nginx/snippets/pratt-seo-static-delivery.conf;
    include /etc/nginx/snippets/pratt-legacy-redirects-server.conf;

    # Canonical hostname; keep exact legacy redirects above this rule.
    if ($host = pratt-oil.com) {
        return 301 https://www.pratt-oil.com$request_uri;
    }
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Keep existing absolute demo links and their relative assets working.
    location ^~ /demo/pratt-oil-oilfield/ {
        root /var/www/html;
        try_files $uri $uri/ =404;
    }
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.pratt-oil.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.pratt-oil.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}
server {
    if ($host = pratt-oil.com) {
        return 301 https://www.pratt-oil.com$request_uri;
    } # managed by Certbot


    if ($host = www.pratt-oil.com) {
        return 301 https://www.pratt-oil.com$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.pratt-oil.com pratt-oil.com;
    return 404; # managed by Certbot




}
