# HTTP example. Configure HTTPS with the receiving server's certificate tooling.
server {
    listen 80;
    server_name pratt-oil.com www.pratt-oil.com;
    root /var/www/pratt-oil;
    index index.html;
    rewrite ^/demo/pratt-oil-oilfield/(.*)$ /$1 last;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
