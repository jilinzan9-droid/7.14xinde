# Include only in the Pratt Oil HTTPS server block.
# The existing http-level gzip setting already compresses text/html.
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json application/xml text/xml text/plain image/svg+xml;
expires $pratt_static_expires;
